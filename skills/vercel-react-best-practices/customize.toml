# DO NOT EDIT -- overwritten on every update.
#
# Workflow customization surface for vercel-react-best-practices. Overrides go in
# {project-root}/_bmad/custom/vercel-react-best-practices.toml and merge per BMad structural rules:
#   scalars: override wins • arrays (persistent_facts, activation_steps_*): append
#   arrays-of-tables with `code`/`id`: replace matching items, append new ones.

[workflow]

# Steps to run before the standard activation. Overrides append.
activation_steps_prepend = []

# Steps to run after persistent facts load but before the workflow begins. Overrides append.
activation_steps_append = []

# Persistent facts the workflow keeps in mind for the whole run. Overrides append.
persistent_facts = [
  "Performance work on React or Next.js code follows the priority order: waterfalls and bundle size before anything else, and every change is measured.",
]

# Scalar: executed after the workflow completes. Override wins. Empty: nothing.
on_complete = ""
